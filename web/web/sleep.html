<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡眠</title>
    <style>
        /* 假设样式与 heart_rate.html 类似，可直接复用 */
        /* 添加页面加载动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        body {
            background-color: white;
            margin: 0;
            padding: 0;
            display: flex;
            animation: fadeIn 1s ease-in-out;
            /* 添加页面加载动画 */
        }

        .sidebar {
            width: 4%;
            background-color: #333;
            height: 120vh;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .sidebar:hover {
            width: 10%;
        }

        .sidebar button {
            background: none;
            border: none;
            color: white;
            margin: 10px 0;
            cursor: pointer;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar:hover button {
            opacity: 1;
        }

        .main-content {
            width: 96%;
            transition: width 0.3s ease;
            position: relative;
        }

        .sidebar:hover+.main-content {
            width: 90%;
        }

        #current-time {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* 确认图片按钮样式一致 */
        .image-button {
            width: 500px;
            height: 300px;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .image-button:hover {
            transform: scale(1.1);
            /* 鼠标悬停时放大 1.1 倍 */
            opacity: 0.7;
        }

        .image-button.enlarged {
            transform: scale(2);
        }

        /* 添加四宫格容器样式 */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 500px);
            gap: 20px;
            justify-content: center;
            margin-top: 50px;
        }

        /* 添加图片按钮悬停动效 */
        .image-button {
            transition: opacity 0.3s ease;
        }

        .image-button:hover {
            opacity: 0.7;
        }

        /* 添加文本显示区域样式 */
        .text-display {
            display: none;
            background-color: #f0f0f0;
            padding: 20px;
            width: 300px;
            height: 300px;
            overflow-y: auto;
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <!-- 使用 <a> 标签包裹按钮实现跳转 -->
        <a href="main.html" style="text-decoration: none;">
            <button>主界面</button>
        </a>
        <a href="heart_rate.html" style="text-decoration: none;">
            <button>心率</button>
        </a>
        <a href="activity_intensity.html" style="text-decoration: none;">
            <button>活动强度</button>
        </a>
        <a href="sleep.html" style="text-decoration: none;">
            <button>睡眠</button>
        </a>
        <a href="settings.html" style="text-decoration: none;">
            <button>设置</button>
        </a>
    </div>
    <div class="main-content">
        <p style="font-size: 48px; font-weight: bold; text-align: center;">小 腕 智 能 穿 戴 设 备 分 析 系 统</p>
        <h1>睡眠页面</h1>
        <!-- 取消注释或者添加当前时间显示区域 -->
        <div id="current-time"></div>
        <!-- 添加文本显示区域 -->
        <div class="text-display" id="textDisplay"></div>
        <!-- 四个图片按钮 -->
        <div class="image-grid">
            <img src="simage1.png" alt="图片1" class="image-button">
            <img src="simage2.png" alt="图片2" class="image-button">
            <img src="simage3.png" alt="图片3" class="image-button">
            <img src="simage4.png" alt="图片4" class="image-button">
        </div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const timeString = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            const currentTimeElement = document.getElementById('current-time');
            if (currentTimeElement) {
                currentTimeElement.textContent = timeString;
            }
        }

        // 页面加载时更新时间
        updateTime();
        // 每秒更新一次时间
        setInterval(updateTime, 1000);

        const texts = [
            "志愿者睡眠阶段（单个）",
            "不同志愿者睡眠阶段比例比较图",
            "深睡眠占比:0.4426751592356688,觉醒次数:289 从深睡眠占比和觉醒次数能够看出，觉醒次数较多，深度睡眠占比较大，说明该志愿者睡眠状态良好。其中成人的深睡占比大约为：15%~25%，年轻人的深度睡大概到达20%~25%，其中儿童的深度睡眠占比可能达到30%以上。从这个条件可以看出，该志愿者属于睡眠人群。",
            "睡眠阶段出现时间分布图"
        ];

        const imageButtons = document.querySelectorAll('.image-button');
        const textDisplay = document.getElementById('textDisplay');

        imageButtons.forEach((button, index) => {
            // 添加鼠标悬停事件
            button.addEventListener('mouseover', () => {
                if (textDisplay) {
                    textDisplay.textContent = texts[index];
                    textDisplay.style.display = 'block';
                }
            });

            // 添加鼠标移出事件
            button.addEventListener('mouseout', () => {
                if (textDisplay) {
                    textDisplay.style.display = 'none';
                }
            });

            // 保留点击事件
            button.addEventListener('click', () => {
                button.classList.toggle('enlarged');
                textDisplay.textContent = texts[index];
                textDisplay.style.display = 'block';
            });
        });

        // 点击页面其他区域隐藏文本显示区域
        document.addEventListener('click', (event) => {
            if (!event.target.classList.contains('image-button')) {
                textDisplay.style.display = 'none';
            }
        });
    </script>
</body>

</html>
