<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="login-container">
        <h2>小腕智能穿戴设备分析系统</h2>
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">账号名：</label>
                <!-- 修改输入框的 value 属性为 1066528 -->
                <input type="text" id="username" value="1066528" required>
            </div>
            <div class="form-group">
                <label for="password">密码：</label>
                <!-- 修改输入框的 value 属性为 1066528 -->
                <input type="password" id="password" value="1066528" required>
            </div>
            <button type="submit">登录</button>
        </form>
        <div id="message"></div>
    </div>
    <!-- 删除背景图片代码 -->
    <!-- 
    <footer>
        <img src="image/underpicure.png" alt="底部图片">
    </footer>
    -->
    <script src="script.js"></script>
</body>

</html>
