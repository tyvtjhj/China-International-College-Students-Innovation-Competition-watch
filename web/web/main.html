<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页面</title>
    <style>
        body {
            background-color: white;
            /* 设置背景颜色为白色 */
            margin: 0;
            padding: 0;
            display: flex;
        }

        .sidebar {
            width: 4%;
            background-color: #333;
            /* 侧边框背景颜色，可根据需要修改 */
            height: 100vh;
            /* 高度占满视口 */
            transition: width 0.3s ease;
            /* 添加过渡效果，使展开更平滑 */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .sidebar:hover {
            width: 10%;
            /* 鼠标悬停时，侧边框宽度变为 10% */
        }

        /* 修改为 <a> 元素的样式 */
        .sidebar a {
            background: none;
            border: none;
            color: white;
            margin: 10px 0;
            cursor: pointer;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-decoration: none;
            /* 去除下划线 */
        }

        .sidebar:hover a {
            opacity: 1;
        }

        .main-content {
            width: 96%;
            /* 可以添加主内容区域的样式 */
            transition: width 0.3s ease;
            /* 添加过渡效果，使主内容区域宽度变化更平滑 */
            position: relative;
            /* 为时间显示容器提供定位参考 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .title-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 0;
            background-color: white;
            z-index: 2;
        }

        .title-container p {
            font-family: "楷体", "楷体_GB2312", "STKaiti", serif;
        }

        .tips {
            position: absolute;
            left: 20px;
            bottom: 20px;
            font-size: 24px;
            color: #666;
        }

        .sidebar:hover+.main-content {
            width: 90%;
            /* 当侧边框展开时，主内容区域宽度变为 90% */
        }

        #current-time {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* 添加图片点击动效 */
        .main-content a img.clicked {
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        /* 添加提示信息样式 */
        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            display: none;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <!-- 使用 <a> 元素实现跳转 -->
        <a href="main.html">主界面</a>
        <a href="heart_rate.html">心率</a>
        <a href="activity_intensity.html">活动强度</a>
        <a href="sleep.html">睡眠</a>
        <a href="settings.html">设置</a>
    </div>
    <div class="main-content">
        <div id="current-time"></div>
        <!-- 添加新文字 -->
        <div class="title-container">
            <p style="font-size: 48px; font-weight: bold; text-align: center;">小 腕 智 能 穿 戴 设 备 分 析 系 统</p>
            <div style="font-size: 24px; text-align: center; margin-top: 20px;">请选择分区</div>
        </div>
        <!-- 修改按钮容器样式，实现横向排列 -->
        <div style="display: flex; flex-direction: row; justify-content: center; gap: 20px;">
            <a href="activity_intensity.html" class="image-link">
                <img src="accessibility.svg" alt="活动强度" style="width: 500px; height: 300px;">
                <div class="tooltip">转跳到活动强度界面</div>
            </a>
            <a href="heart_rate.html" class="image-link">
                <img src="activity-filled.svg" alt="心率" style="width: 500px; height: 300px;">
                <div class="tooltip">转跳到心率界面</div>
            </a>
            <a href="sleep.html" class="image-link">
                <img src="sleep.svg" alt="睡眠" style="width: 500px; height: 300px;">
                <div class="tooltip">转跳到睡眠界面</div>
            </a>
        </div>
        <p class="tips">
            tips:向左滑可查看导航栏
        </p>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const timeString = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            document.getElementById('current-time').textContent = timeString;
        }

        // 页面加载时更新时间
        updateTime();
        // 每秒更新一次时间
        setInterval(updateTime, 1000);
        // 添加图片点击事件处理逻辑
        const imageButtons = document.querySelectorAll('.main-content a img');
        imageButtons.forEach(button => {
            button.addEventListener('click', () => {
                button.classList.toggle('clicked');
            });
        });

        // 添加鼠标悬停提示信息
        const imageLinks = document.querySelectorAll('.image-link');
        imageLinks.forEach(link => {
            const img = link.querySelector('img');
            const tooltip = link.querySelector('.tooltip');

            img.addEventListener('mouseover', () => {
                tooltip.style.display = 'block';
                tooltip.style.left = img.offsetLeft + 'px';
                tooltip.style.top = img.offsetTop + img.offsetHeight + 'px';
            });

            img.addEventListener('mouseout', () => {
                tooltip.style.display = 'none';
            });
        });
    </script>
</body>

</html>
