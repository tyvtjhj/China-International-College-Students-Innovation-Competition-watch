<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动强度</title>
    <style>
        /* 添加页面加载动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        body {
            background-color: white;
            margin: 0;
            padding: 0;
            display: flex;
            animation: fadeIn 1s ease-in-out;
            /* 添加页面加载动画 */
        }

        .sidebar {
            width: 4%;
            background-color: #333;
            height: 120vh;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .sidebar:hover {
            width: 10%;
        }

        .sidebar button {
            background: none;
            border: none;
            color: white;
            margin: 10px 0;
            cursor: pointer;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar:hover button {
            opacity: 1;
        }

        .main-content {
            width: 96%;
            transition: width 0.3s ease;
            position: relative;
        }

        .sidebar:hover+.main-content {
            width: 90%;
        }

        #current-time {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* 添加图片按钮样式 */
        .image-button {
            width: 500px;
            height: 300px;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .image-button:hover {
            transform: scale(1.1);
            /* 鼠标悬停时放大 1.1 倍 */
            opacity: 0.7;
        }

        .image-button.enlarged {
            transform: scale(2);
        }

        /* 添加四宫格容器样式 */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 500px);
            gap: 20px;
            justify-content: center;
            margin-top: 50px;
        }

        /* 添加文本显示区域样式 */
        .text-display {
            display: none;
            background-color: #f0f0f0;
            padding: 20px;
            width: 300px;
            height: 300px;
            overflow-y: auto;
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <!-- 使用 <a> 标签包裹按钮实现跳转 -->
        <a href="main.html" style="text-decoration: none;">
            <button>主界面</button>
        </a>
        <a href="heart_rate.html" style="text-decoration: none;">
            <button>心率</button>
        </a>
        <a href="activity_intensity.html" style="text-decoration: none;">
            <button>活动强度</button>
        </a>
        <a href="sleep.html" style="text-decoration: none;">
            <button>睡眠</button>
        </a>
        <a href="settings.html" style="text-decoration: none;">
            <button>设置</button>
        </a>
    </div>
    <div class="main-content">
        <p style="font-size: 48px; font-weight: bold; text-align: center;">小 腕 智 能 穿 戴 设 备 分 析 系 统</p>
        <h1>活动强度页面</h1>
        <!-- 取消注释当前时间显示区域 -->
        <div id="current-time"></div>
        <!-- 添加 4 张图片按钮 -->
        <!-- 修改图片按钮容器 -->
        <div class="image-grid">
            <img src="aimage1.png" alt="图片1" class="image-button">
            <img src="aimage2.png" alt="图片2" class="image-button">
            <img src="aimage3.png" alt="图片3" class="image-button">
            <img src="aimage4.png" alt="图片4" class="image-button">
        </div>
        <!-- 添加文本显示区域 -->
        <div class="text-display" id="textDisplay"></div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const timeString = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            const currentTimeElement = document.getElementById('current-time');
            if (currentTimeElement) {
                currentTimeElement.textContent = timeString;
            }
        }

        // 页面加载时更新时间
        updateTime();
        // 每秒更新一次时间
        setInterval(updateTime, 1000);

        const texts = [
            "用户1066528的日常活动强度大部分时间活动为久坐，而中强度活动和高强度活动时间短。",
            "对于该用户我们可以看出他们的久坐时间较长，而中强度时间最短。",
            "对整体的各个强度活动的时长分布和日常活动状态对比",
            "志愿者bpm和频率柱状图，横轴：心率值（bpm）分段区间 纵轴：各区间出现频次 红色曲线：正态分布拟合，反映数据集中趋势 结论：该志愿者心率主要分布在55-75bpm，呈轻微右偏（存在少量高心率异常点）。"
        ];

        // 添加图片点击事件处理逻辑
        const imageButtons = document.querySelectorAll('.image-button');
        const textDisplay = document.getElementById('textDisplay');

        imageButtons.forEach((button, index) => {
            // 添加鼠标悬停事件
            button.addEventListener('mouseover', () => {
                if (textDisplay) {
                    textDisplay.textContent = texts[index];
                    textDisplay.style.display = 'block';
                }
            });

            // 添加鼠标移出事件
            button.addEventListener('mouseout', () => {
                if (textDisplay) {
                    textDisplay.style.display = 'none';
                }
            });

            button.addEventListener('click', () => {
                button.classList.toggle('enlarged');
                if (textDisplay) {
                    textDisplay.textContent = texts[index];
                    textDisplay.style.display = 'block';
                }
            });
        });

        // 点击页面其他区域隐藏文本显示区域
        document.addEventListener('click', (event) => {
            if (!event.target.classList.contains('image-button') && textDisplay) {
                textDisplay.style.display = 'none';
            }
        });
    </script>
</body>

</html>
